# Local development only. Do not push this config over an existing cloud project.
project_id = "aab-attendance-portal"

[api]
enabled = true
port = 56431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56432
shadow_port = 56430
major_version = 15

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 56433

[inbucket]
enabled = true
port = 56434

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8765"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Kodi i hyrjes · AAB"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "Verifiko emailin · AAB"
content_path = "./supabase/templates/otp.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
